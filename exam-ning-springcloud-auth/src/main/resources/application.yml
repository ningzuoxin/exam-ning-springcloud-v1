server:
  port: 9527

spring:
  application:
    name: exam-ning-auth
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848 # 服务注册中心
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 15
      password: 123456
      repositories:
        enabled: false

feign:
  client:
    config:
      default:
        connectTimeout: 30000
        readTimeout: 30000
  hystrix:
    enabled: false

logging:
  config: classpath:log4j2-spring.xml
  file:
    path: ${LOG_FILE_PATH:E:\tmp\mnt\logs\exam\auth}
    max-size: 100 MB
    max-history: 30
#  level:
#    root: ${LOG_LEVEL_ROOT:INFO}

